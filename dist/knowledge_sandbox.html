<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Research Knowledge Management Sandbox</title><style>
:root{--bg:#07111e;--card:#0f2034;--line:#294766;--text:#eaf3ff;--muted:#a4b7cc;--primary:#55E5BD;--accent:#A98BFF}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:32px}.tag{color:var(--primary);font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}h1{font-size:34px;margin:7px 0}.intro,.meta{color:var(--muted);line-height:1.55}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px}.kpi{padding:17px}.kpi b{display:block;font-size:27px;margin-top:6px;color:var(--primary)}.grid{display:grid;grid-template-columns:1fr 370px;gap:16px}.toolbar{padding:14px;display:flex;gap:9px;border-bottom:1px solid var(--line)}input,button{background:#09192a;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:9px}input{width:100%}button{cursor:pointer}button.on{border-color:var(--primary);color:var(--primary)}table{border-collapse:collapse;width:100%}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:10px;text-transform:uppercase}tr{cursor:pointer}tr:hover{background:#182f4a}.ready{color:var(--primary)}.attention{color:#ffc970}aside{padding:18px;min-height:420px}aside p,aside li{color:var(--muted);line-height:1.55}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;background:#09192a;border-radius:7px;color:var(--muted)}.stat b{display:block;font-size:18px;color:var(--primary)}footer{margin-top:18px;color:var(--muted)}@media(max-width:800px){main{padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><main><div class='tag'>Research intelligence · local knowledge inventory</div><h1>Research Knowledge Hub</h1><p class='intro'>A governed map of research documents and semantic assets.</p><section class='kpis' id='kpis'></section><p class='meta' id='meta'></p><section class='grid'><section class='card'><div class='toolbar'><input id='find' placeholder='Filter assets, formats, classes, predicates'><button class='on' data-filter='all'>All</button><button data-filter='Ontology'>Ontologies</button></div><table><thead><tr><th>Asset</th><th>Format</th><th>Profile</th></tr></thead><tbody id='rows'></tbody></table></section><aside class='card' id='detail'><p>Select an ontology to inspect its schema profile.</p></aside></section><footer><small>Internal research knowledge product</small></footer></main><script>const I={"generatedAt": "2026-10-29 11:27 UTC", "roots": ["D:\\vscode\\knowledge-sandbox\\examples"], "notices": [], "assets": [{"id": "815c8a9291fa6240", "path": "D:\\vscode\\knowledge-sandbox\\examples\\clinical-trials.ttl", "relativePath": "clinical-trials.ttl", "root": "D:\\vscode\\knowledge-sandbox\\examples", "extension": ".ttl", "kind": "Ontology", "assetType": "Ontology", "mimeType": "application/rdf+xml", "details": {}, "size": 354, "modified": "2026-10-29 09:52 UTC", "profile": {"status": "ready", "triples": 7, "classes": 2, "objectProperties": 1, "datatypeProperties": 0, "classSample": ["Clinical study", "Participant"], "predicateSample": ["type", "label", "domain", "range"], "namespaces": ["https://brickschema.org/schema/Brick#", "http://www.w3.org/ns/csvw#", "http://purl.org/dc/elements/1.1/", "http://www.w3.org/ns/dcat#", "http://purl.org/dc/dcmitype/", "http://purl.org/dc/terms/", "http://purl.org/dc/dcam/", "http://usefulinc.com/ns/doap#", "http://xmlns.com/foaf/0.1/", "http://www.opengis.net/ont/geosparql#", "http://www.w3.org/ns/odrl/2/", "http://www.w3.org/ns/org#"], "error": ""}}, {"id": "e5e203ccfdd91cac", "path": "D:\\vscode\\knowledge-sandbox\\examples\\governance.owl", "relativePath": "governance.owl", "root": "D:\\vscode\\knowledge-sandbox\\examples", "extension": ".owl", "kind": "Ontology", "assetType": "Ontology", "mimeType": "application/rdf+xml", "details": {}, "size": 342, "modified": "2026-10-29 09:52 UTC", "profile": {"status": "ready", "triples": 2, "classes": 1, "objectProperties": 0, "datatypeProperties": 0, "classSample": ["Data asset"], "predicateSample": ["type", "label"], "namespaces": ["https://brickschema.org/schema/Brick#", "http://www.w3.org/ns/csvw#", "http://purl.org/dc/elements/1.1/", "http://www.w3.org/ns/dcat#", "http://purl.org/dc/dcmitype/", "http://purl.org/dc/terms/", "http://purl.org/dc/dcam/", "http://usefulinc.com/ns/doap#", "http://xmlns.com/foaf/0.1/", "http://www.opengis.net/ont/geosparql#", "http://www.w3.org/ns/odrl/2/", "http://www.w3.org/ns/org#"], "error": ""}}, {"id": "ce552a1af448d043", "path": "D:\\vscode\\knowledge-sandbox\\examples\\research.jsonld", "relativePath": "research.jsonld", "root": "D:\\vscode\\knowledge-sandbox\\examples", "extension": ".jsonld", "kind": "Ontology", "assetType": "Ontology", "mimeType": "application/rdf+xml", "details": {}, "size": 179, "modified": "2026-10-29 09:52 UTC", "profile": {"status": "ready", "triples": 2, "classes": 0, "objectProperties": 0, "datatypeProperties": 0, "classSample": [], "predicateSample": ["type", "name"], "namespaces": ["https://brickschema.org/schema/Brick#", "http://www.w3.org/ns/csvw#", "http://purl.org/dc/elements/1.1/", "http://www.w3.org/ns/dcat#", "http://purl.org/dc/dcmitype/", "http://purl.org/dc/terms/", "http://purl.org/dc/dcam/", "http://usefulinc.com/ns/doap#", "http://xmlns.com/foaf/0.1/", "http://www.opengis.net/ont/geosparql#", "http://www.w3.org/ns/odrl/2/", "http://www.w3.org/ns/org#"], "error": ""}}, {"id": "7c8a2ce7a2e33b56", "path": "D:\\vscode\\knowledge-sandbox\\examples\\dataset-catalog.csv", "relativePath": "dataset-catalog.csv", "root": "D:\\vscode\\knowledge-sandbox\\examples", "extension": ".csv", "kind": "Document", "assetType": "CSV data", "mimeType": "text/csv", "details": {"columns": 3, "columnNames": ["dataset", "owner", "status"]}, "size": 52, "modified": "2026-10-29 10:32 UTC", "profile": null}, {"id": "6e11f30b89922c66", "path": "D:\\vscode\\knowledge-sandbox\\examples\\research-notes.md", "relativePath": "research-notes.md", "root": "D:\\vscode\\knowledge-sandbox\\examples", "extension": ".md", "kind": "Document", "assetType": "Markdown", "mimeType": "text/markdown", "details": {"headings": 2, "lines": 5}, "size": 92, "modified": "2026-10-29 10:32 UTC", "profile": null}], "summary": {"assets": 5, "ontologies": 3, "triples": 11, "classes": 3, "formats": {".ttl": 1, ".owl": 1, ".jsonld": 1}}};let filter='all';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const n=x=>new Intl.NumberFormat().format(x);function rows(){let q=find.value.toLowerCase(),list=I.assets.filter(x=>(filter==='all'||x.kind===filter)&&JSON.stringify(x).toLowerCase().includes(q));document.querySelector('#rows').innerHTML=list.map(x=>{let p=x.profile;return `<tr onclick="showDetail('${x.id}')"><td><b>${e(x.relativePath)}</b><br><small>${e(x.kind)}</small></td><td>${e(x.extension)}</td><td>${p?`<span class='${p.status}'>${p.status}</span><br><small>${n(p.triples)} triples · ${p.classes} classes</small>`:'—'}</td></tr>`}).join('')||'<tr><td colspan=3>No matching assets</td></tr>'}function showDetail(id){let x=I.assets.find(v=>v.id===id),p=x.profile;if(!p){document.querySelector('#detail').innerHTML='<p>Non-semantic knowledge asset.</p>';return}document.querySelector('#detail').innerHTML=`<div class='tag'>${e(x.extension)} ontology</div><h2>${e(x.relativePath)}</h2><div class='stats'>${[['Triples',p.triples],['Classes',p.classes],['Object properties',p.objectProperties],['Datatype properties',p.datatypeProperties]].map(a=>`<div class='stat'><b>${n(a[1])}</b>${a[0]}</div>`).join('')}</div><h3>Classes</h3><p>${p.classSample.map(e).join(' · ')||'No explicit classes found.'}</p><h3>Predicates</h3><p>${p.predicateSample.map(e).join(' · ')||'—'}</p><h3>Namespaces</h3><ul>${p.namespaces.map(v=>`<li>${e(v)}</li>`).join('')||'<li>—</li>'}</ul>${p.error?`<p class='attention'>${e(p.error)}</p>`:''}`};const find=document.querySelector('#find');find.oninput=rows;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));rows()});document.querySelector('#kpis').innerHTML=[['Knowledge assets',I.summary.assets],['Ontologies',I.summary.ontologies],['RDF triples',I.summary.triples],['Classes',I.summary.classes]].map(a=>`<div class='card kpi'><small>${a[0]}</small><b>${n(a[1])}</b></div>`).join('');document.querySelector('#meta').textContent=`Scanned ${I.roots.join(' · ')} | ${Object.entries(I.summary.formats).map(a=>a[0]+' ('+a[1]+')').join(', ')}`;rows();</script></body></html>
